# ── Prefix ────────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── True colour (required for nvim themes) ────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# ── General ───────────────────────────────────────────────────────────────────
set -sg escape-time 0          # no delay after Escape (important for nvim)
set -g history-limit 10000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on

# ── Splits ────────────────────────────────────────────────────────────────────
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ── Pane navigation (Alt + arrow, no prefix) ──────────────────────────────────
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# ── Pane resize (prefix + HJKL, repeatable) ───────────────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Copy mode (vi keys) ───────────────────────────────────────────────────────
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel

# ── Status bar layout (colours sourced from theme files below) ────────────────
set -g status-position top
set -g status-left-length  30
set -g status-right-length 30
set -g window-status-format         " #I #W "
set -g window-status-current-format " #I #W "

# ── Theme: detected at config load via macOS system appearance ────────────────
# To switch mid-session after toggling dark/light: prefix + r
if-shell "defaults read -g AppleInterfaceStyle 2>/dev/null | grep -q Dark" \
  "source-file ~/.config/tmux/themes/dark.tmux" \
  "source-file ~/.config/tmux/themes/light.tmux"

# ── Reload config ─────────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"
