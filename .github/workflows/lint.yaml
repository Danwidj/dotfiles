name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install shellcheck and yamllint
        run: sudo apt-get update && sudo apt-get install -y shellcheck yamllint

      - name: Run lint script
        run: ./scripts/lint.sh
