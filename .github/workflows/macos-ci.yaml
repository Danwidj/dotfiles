name: macOS CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/ci.yaml'
      - '.github/workflows/lint.yaml'
  pull_request:
    branches: [main]
    paths-ignore:
      - '.github/workflows/ci.yaml'
      - '.github/workflows/lint.yaml'

permissions:
  contents: read

jobs:
  full-apply:
    name: Full apply (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install chezmoi
        run: ./scripts/ci-install-chezmoi.sh

      - name: Install bats-core
        run: brew install bats-core

      - name: Create chezmoi config with CI data
        run: ./scripts/ci-write-chezmoi-config.sh

      - name: Run chezmoi init --apply (full macOS apply)
        run: ./scripts/ci-chezmoi-apply.sh

      - name: Run Bats tests (all)
        run: |
          bats --print-output-on-failure tests/files/*.bats
