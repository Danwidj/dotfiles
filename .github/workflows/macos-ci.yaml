name: macOS CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/ci.yaml'
      - '.github/workflows/lint.yaml'
  pull_request:
    branches: [main]
    paths-ignore:
      - '.github/workflows/ci.yaml'
      - '.github/workflows/lint.yaml'

permissions:
  contents: read

jobs:
  full-apply:
    name: Full apply (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v5

      - name: Trust mise configuration
        run: mise trust

      - name: Create chezmoi config with CI data
        run: mise run ci:write-chezmoi-config

      - name: Run chezmoi init --apply (full macOS apply)
        run: mise run ci:apply

      - name: Run Bats tests (all)
        run: mise run test
