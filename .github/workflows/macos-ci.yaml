name: macOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  full-apply:
    name: Full apply (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install chezmoi
        run: |
          CHEZMOI_VERSION=$(curl -s https://api.github.com/repos/twpayne/chezmoi/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
          curl -sfL "https://github.com/twpayne/chezmoi/releases/download/${CHEZMOI_VERSION}/chezmoi_${CHEZMOI_VERSION#v}_darwin_arm64.tar.gz" -o /tmp/chezmoi.tar.gz
          tar -xzf /tmp/chezmoi.tar.gz -C /tmp
          sudo mv /tmp/chezmoi /usr/local/bin/chezmoi

      - name: Create chezmoi config with CI data
        run: |
          mkdir -p ~/.config/chezmoi
          cat > ~/.config/chezmoi/chezmoi.toml <<'EOF'
          [data]
              machine_type = "personal"
              email = "ci@example.com"
          EOF

      - name: Run chezmoi init --apply (full macOS apply)
        run: |
          chezmoi init --apply --source=.

      - name: Verify configs applied
        run: |
          echo "Checking configs applied..."
          test -f "$HOME/.config/zsh/managed.zsh" && echo "✓ zsh config applied"
          test -f "$HOME/.config/nvim/init.lua" && echo "✓ nvim config applied"
          test -f "$HOME/.config/tmux/tmux.conf" && echo "✓ tmux config applied"
          test -f "$HOME/.config/ghostty/config" && echo "✓ ghostty config applied"
          test -f "$HOME/.config/starship.toml" && echo "✓ starship config applied"
          test -f "$HOME/.gitconfig" && echo "✓ git config applied"