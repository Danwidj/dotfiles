name: CI Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    name: Smoke test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install chezmoi
        run: |
          CHEZMOI_VERSION=$(curl -s https://api.github.com/repos/twpayne/chezmoi/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
          curl -sfL "https://github.com/twpayne/chezmoi/releases/download/${CHEZMOI_VERSION}/chezmoi_${CHEZMOI_VERSION#v}_linux_amd64.tar.gz" | tar -xz -C /tmp
          sudo mv /tmp/chezmoi /usr/local/bin/chezmoi

      - name: Create chezmoi config with CI data
        run: |
          mkdir -p ~/.config/chezmoi
          cat > ~/.config/chezmoi/chezmoi.toml <<'EOF'
          [data]
              machine_type = "personal"
              email = "ci@example.com"
          EOF

      - name: Run chezmoi init (verify templates parse, no apply)
        run: |
          chezmoi init --source=.

      - name: Verify cross-platform configs exist in source
        run: |
          echo "Checking cross-platform configs in source..."
          test -f "dot_config/zsh/managed.zsh" && echo "✓ zsh config exists"
          test -f "dot_config/nvim/init.lua" && echo "✓ nvim config exists"
          test -f "dot_config/tmux/tmux.conf" && echo "✓ tmux config exists"
          test -f "dot_config/ghostty/config" && echo "✓ ghostty config exists"
          test -f "dot_config/starship.toml" && echo "✓ starship config exists"
          test -f "dot_gitconfig" && echo "✓ git config exists"