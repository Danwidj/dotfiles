name: CI Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    name: Smoke test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install chezmoi
        run: |
          CHEZMOI_VERSION=$(curl -s https://api.github.com/repos/twpayne/chezmoi/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
          curl -sfL "https://github.com/twpayne/chezmoi/releases/download/${CHEZMOI_VERSION}/chezmoi_${CHEZMOI_VERSION#v}_linux_amd64.tar.gz" | tar -xz -C /tmp
          sudo mv /tmp/chezmoi /usr/local/bin/chezmoi

      - name: Create chezmoi config with CI data
        run: |
          mkdir -p ~/.config/chezmoi
          cat > ~/.config/chezmoi/chezmoi.toml <<'EOF'
          [data]
              machine_type = "personal"
              email = "ci@example.com"
          EOF

      - name: Create Linux-compatible Brewfile
        run: |
          mkdir -p ~/.config/homebrew
          # Filter out macOS-only packages for Linux CI
          cat > ~/.config/homebrew/Brewfile <<'EOF'
          # Brewfile - Linux CI smoke test (cross-platform packages only)
          tap "domt4/autoupdate"

          # Core
          brew "git"
          brew "chezmoi"
          brew "direnv"
          brew "age"
          brew "sops"
          brew "gh"

          # Shell
          brew "starship"
          brew "zsh-autosuggestions"
          brew "zoxide"
          brew "atuin"
          brew "fzf"

          # Editor / Terminal / Multiplexer
          brew "neovim"
          brew "tmux"
          brew "herdr"
          brew "lazygit"

          # LazyVim deps
          brew "ripgrep"
          brew "fd"
          brew "node"

          # Dev tools
          brew "mise"
          brew "uv"
          brew "just"
          brew "jq"
          brew "yq"
          brew "delta"
          brew "serpl"

          # Container
          brew "colima"
          brew "docker"
          brew "docker-compose"

          # Services
          brew "nginx"
          brew "redis"
          brew "sqlite"
          brew "openssl@3"

          # CLI utilities (cross-platform only)
          brew "bat"
          brew "eza"
          brew "btop"
          brew "tlrc"
          brew "ffmpeg"
          brew "sevenzip"
          # EXCLUDED macOS-only: cliclick, duti

          # GUI apps (cross-platform only)
          cask "obsidian"
          cask "visual-studio-code"
          cask "google-chrome"
          cask "claude"
          cask "claude-code"
          cask "ngrok"
          # EXCLUDED macOS-only: ghostty, raycast, aerospace, intellij-idea
          EOF

      - name: Run chezmoi init --apply (smoke test)
        run: |
          # Add Homebrew to PATH for this step (Homebrew installs to this path on Linux)
          export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
          chezmoi init --apply --source=.
        continue-on-error: true

      - name: Verify cross-platform configs applied
        run: |
          echo "Checking cross-platform configs..."
          test -f "$HOME/.config/zsh/managed.zsh" && echo "✓ zsh config applied"
          test -f "$HOME/.config/nvim/init.lua" && echo "✓ nvim config applied"
          test -f "$HOME/.config/tmux/tmux.conf" && echo "✓ tmux config applied"
          test -f "$HOME/.config/ghostty/config" && echo "✓ ghostty config applied"
          test -f "$HOME/.config/starship.toml" && echo "✓ starship config applied"
          test -f "$HOME/.gitconfig" && echo "✓ git config applied"