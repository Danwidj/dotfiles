name: CI Smoke Test

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/macos-ci.yaml'
      - 'home/dot_config/aerospace/**'
      - 'home/dot_config/raycast/**'
      - 'home/private_Library/**'
      - 'home/.chezmoiscripts/run_once_after_macos.sh'
      - 'tests/files/macos.bats'
  pull_request:
    branches: [main]
    paths-ignore:
      - '.github/workflows/macos-ci.yaml'
      - 'home/dot_config/aerospace/**'
      - 'home/dot_config/raycast/**'
      - 'home/private_Library/**'
      - 'home/.chezmoiscripts/run_once_after_macos.sh'
      - 'tests/files/macos.bats'

permissions:
  contents: read

jobs:
  smoke-test:
    name: Smoke test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v5

      - name: Trust mise configuration
        run: mise trust

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Install Homebrew
        run: |
          mise run ci:install-homebrew
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          echo "/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"

      - name: Create chezmoi config with CI data
        run: mise run ci:write-chezmoi-config

      - name: Run chezmoi init --apply (verify templates parse and apply, no scripts)
        run: |
          # --exclude=scripts renders and applies every file but never executes
          # run_once_*/run_onchange_* scripts. This repo is macOS-only (see
          # macos-ci.yaml for the real full-apply-with-scripts test on the
          # correct OS); running scripts here would execute macOS-only
          # commands (Homebrew, `defaults`, `osascript`, ...) on Linux.
          mise run ci:apply --exclude=scripts

      - name: Run Bats tests (common + data)
        run: |
          bats --print-output-on-failure tests/files/common.bats tests/files/data.bats
