name: CI Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke-test:
    name: Smoke test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install chezmoi
        run: |
          CHEZMOI_VERSION="v2.72.2"
          curl -sfL "https://github.com/twpayne/chezmoi/releases/download/${CHEZMOI_VERSION}/chezmoi_${CHEZMOI_VERSION#v}_linux_amd64.tar.gz" | tar -xz -C /tmp
          sudo mv /tmp/chezmoi /usr/local/bin/chezmoi

      - name: Install bats-core
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Create chezmoi config with CI data
        run: |
          mkdir -p ~/.config/chezmoi
          cat > ~/.config/chezmoi/chezmoi.toml <<'EOF'
          [data]
              machine_type = "personal"
              email = "ci@example.com"
          EOF

      - name: Run chezmoi init --apply (verify templates parse and apply)
        run: |
          chezmoi init --apply --source=.

      - name: Run Bats tests (common + data)
        run: |
          bats --print-output-on-failure tests/files/common.bats tests/files/data.bats