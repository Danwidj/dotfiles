name: CI Smoke Test

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/macos-ci.yaml'
      - 'home/dot_config/aerospace/**'
      - 'home/dot_config/raycast/**'
      - 'home/private_Library/**'
      - 'home/run_once_macos.sh'
      - 'tests/files/macos.bats'
  pull_request:
    branches: [main]
    paths-ignore:
      - '.github/workflows/macos-ci.yaml'
      - 'home/dot_config/aerospace/**'
      - 'home/dot_config/raycast/**'
      - 'home/private_Library/**'
      - 'home/run_once_macos.sh'
      - 'tests/files/macos.bats'

permissions:
  contents: read

jobs:
  smoke-test:
    name: Smoke test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install chezmoi
        run: |
          CHEZMOI_VERSION="v2.72.2"
          CHEZMOI_URL="https://github.com/twpayne/chezmoi/releases/download/${CHEZMOI_VERSION}"
          CHEZMOI_ARCHIVE="chezmoi_${CHEZMOI_VERSION#v}_linux_amd64.tar.gz"
          curl -sfL "${CHEZMOI_URL}/${CHEZMOI_ARCHIVE}" | tar -xz -C /tmp
          sudo mv /tmp/chezmoi /usr/local/bin/chezmoi

      - name: Install bats-core
        run: sudo apt-get update && sudo apt-get install -y bats zsh

      - name: Install Homebrew
        run: |
          NONINTERACTIVE=1 /bin/bash -c \
            "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          echo "/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"

      - name: Create chezmoi config with CI data
        run: |
          mkdir -p ~/.config/chezmoi
          cat > ~/.config/chezmoi/chezmoi.toml <<'EOF'
          [data]
              machine_type = "personal"
              email = "ci@example.com"
          EOF

      - name: Run chezmoi init --apply (verify templates parse and apply, no scripts)
        run: |
          # --exclude=scripts renders and applies every file but never executes
          # run_once_*/run_onchange_* scripts. This repo is macOS-only (see
          # macos-ci.yaml for the real full-apply-with-scripts test on the
          # correct OS); running scripts here would execute macOS-only
          # commands (Homebrew, `defaults`, `osascript`, ...) on Linux.
          chezmoi init --apply --source=. --exclude=scripts

      - name: Run Bats tests (common + data)
        run: |
          bats --print-output-on-failure tests/files/common.bats tests/files/data.bats
