"$schema" = 'https://starship.rs/config-schema.json'

# Pure-style prompt (https://starship.rs/presets/pure-preset) with dev modules and a right prompt
add_newline = false

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$package\
$nodejs\
$python\
$rust\
$golang\
$docker_context\
$cmd_duration\
$line_break\
${env_var.VIRTUAL_ENV_PROMPT}\
$character"""

right_format = "$status$jobs$aws${custom.aws_sso_expiry}$time"

[username]
style_user = "bright-black"
style_root = "red"
format = "[$user]($style)"

[hostname]
style = "bright-black"
format = "[@$hostname]($style) "

[directory]
style = "blue"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
style = "bright-black"
format = "[$branch]($style) "

[git_state]
style = "bright-black"
format = '\([$state( $progress_current/$progress_total)]($style)\) '

[git_status]
style = "cyan"
format = '[($conflicted$untracked$index_added$index_modified$index_deleted$renamed$worktree_modified$worktree_deleted)($ahead_behind$stashed)]($style)'
conflicted = "[UU$count ](red)"
untracked = "[??$count ](red)"
index_added = "[A$count ](green)"
index_modified = "[M$count ](green)"
index_deleted = "[D$count ](green)"
renamed = "[R$count ](green)"
worktree_modified = "[M$count ](red)"
worktree_deleted = "[D$count ](red)"
ahead = "↑$count "
behind = "↓$count "
diverged = "↑${ahead_count}↓${behind_count} "
stashed = "≡$count "

[package]
style = "bright-black"
format = "[$symbol$version]($style) "

[nodejs]
style = "bright-black"
format = "[$symbol($version )]($style)"

[python]
style = "bright-black"
format = "[$symbol$pyenv_prefix($version )]($style)"

[rust]
style = "bright-black"
format = "[$symbol($version )]($style)"

[golang]
style = "bright-black"
format = "[$symbol($version )]($style)"

[docker_context]
style = "bright-black"
format = "[$symbol$context]($style) "
only_with_files = true

[cmd_duration]
min_time = 2_000
style = "yellow"
format = "[$duration]($style) "

[env_var.VIRTUAL_ENV_PROMPT]
style = "bright-black"
format = "[\\($env_value\\) ]($style)"

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

# Right prompt
[status]
disabled = false
style = "red"
success_style = "green"
symbol = ""
success_symbol = "✓"
format = "[$symbol$common_meaning$signal_name$maybe_int]($style) "
pipestatus = true
pipestatus_segment_format = "[$symbol$common_meaning$signal_name$maybe_int]($style)"

[time]
disabled = false
time_format = "%R"
style = "bright-black"
format = "[$time]($style) "

[aws]
style = "bold yellow"
symbol = "☁️ "
expiration_symbol = "X"
format = '[$symbol$profile( \($region\))( \[$duration\])]($style) '

[custom.aws_sso_expiry]
command = "~/.config/starship/aws-sso-expiry.sh"
when = 'test -n "$AWS_PROFILE" || test -n "$AWS_DEFAULT_PROFILE" || test -n "$AWS_VAULT" || test -n "$AWS_SSO_PROFILE"'
format = '([\[$output\]]($style) )'
style = "bold yellow"
description = "AWS SSO session expiry countdown"
