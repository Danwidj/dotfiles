"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

format = """
[░▒▓](#a3aed2)\
$username\
$hostname\
$directory\
[ ](fg:#a3aed2)\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$package\
$nodejs\
$python\
$rust\
$golang\
$docker_context\
$line_break\
$character"""

right_format = "$status$aws${custom.aws_sso_expiry}$time"

[directory]
format= "[$path]($style)"
style = "bg:#a3aed2 fg:#090c0c"

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vicmd_symbol = "[❮](green)"

[cmd_duration]
min_time = 2_000
format = "[$duration]($style) "
style = "yellow"

[status]
disabled = false
format = "[$status]($style) "
style = "red"

[time]
disabled = false
time_format = "%R"
format = "[$time](bright-black) "
style = "bright-black"

[git_branch]
format = "[$branch]($style)"
style = "bright-black"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](218) ($ahead_behind$stashed)]($style)"
style = "cyan"
conflicted = "=$count "
untracked = "?$count "
modified = "!$count "
staged = "+$count "
renamed = "»$count "
deleted = "✘$count "
ahead = "⇡$count"
behind = "⇣$count"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
stashed = "≡$count"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[package]
format = "[$symbol$version]($style) "
style = "bright-black"

[nodejs]
format = "[$symbol($version )]($style)"
style = "bright-black"

[python]
format = "[$symbol$pyenv_prefix($version )(\\($virtualenv\\) )]($style)"
style = "bright-black"

[rust]
format = "[$symbol($version )]($style)"
style = "bright-black"

[golang]
format = "[$symbol($version )]($style)"
style = "bright-black"

[mise]
disabled = false
format = "[$symbol$health]($style) "
style = "bright-black"

[docker_context]
format = "[$symbol$context]($style) "
style = "bright-black"
only_with_files = true

[aws]
format = '[$symbol$profile( \($region\))( \[$duration\])]($style) '
style = "bold yellow"
symbol = "☁️ "
expiration_symbol = "X"

[custom.aws_sso_expiry]
command = "~/.config/starship/aws-sso-expiry.sh"
when = 'test -n "$AWS_PROFILE" || test -n "$AWS_DEFAULT_PROFILE" || test -n "$AWS_VAULT" || test -n "$AWS_SSO_PROFILE"'
format = '([\[$output\]]($style) )'
style = "bold yellow"
description = "AWS SSO session expiry countdown"
